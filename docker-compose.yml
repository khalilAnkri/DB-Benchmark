services:
  postgres:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    container_name: pg
    environment:
      POSTGRES_PASSWORD: bench
    cpuset: "0-3"
    mem_limit: 8g
    memswap_limit: 8g
    shm_size: 2560m
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./data:/data:ro
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c work_mem=256MB
      -c max_parallel_workers_per_gather=3
      -c max_parallel_workers=4
      -c random_page_cost=1.1
      -c jit=on

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.36.3@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
    container_name: ch
    environment:
      CLICKHOUSE_PASSWORD: bench
    cpuset: "0-3"
    mem_limit: 8g
    memswap_limit: 8g
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    ports: ["8123:8123", "9000:9000"]
    volumes:
      - chdata:/var/lib/clickhouse
      - ./config/clickhouse/bench.xml:/etc/clickhouse-server/users.d/bench.xml:ro
      - ./data:/data:ro

volumes:
  pgdata:
  chdata:
